<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in · Sophia</title>
<style>
  /* The demo sign-in page (AUTH_MODE=password). BetterCare theme, light only,
     like the admin panel. Microsoft sign-in replaces this page later. */
  :root {
    color-scheme: light;
    --primary: #CA5010; --primary-dark: #993E0C; --primary-light: #F6DFD2;
    --ink: #242424; --ink-2: #605E5C; --ink-3: #6E6C6A;
    --line: #E1DFDD; --well: #F3F2F1; --danger: #A4262C;
    --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: #FAF9F8; color: var(--ink); font: 400 15px/22px var(--font); }
  main { width: 100%; max-width: 400px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 32px 28px 24px; box-shadow: 0 1.6px 3.6px rgb(0 0 0 / .08), 0 6px 18px rgb(0 0 0 / .06); }
  .mark { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: #fff; background: linear-gradient(145deg, var(--primary), #b8480e 60%, var(--primary-dark) 145%); }
  .mark svg { width: 22px; height: 22px; }
  h1 { font: 700 24px/30px var(--font); margin: 16px 0 4px; }
  .sub { margin: 0 0 24px; color: var(--ink-2); }
  label { display: block; font-weight: 600; font-size: 14px; margin: 0 0 6px; }
  input { width: 100%; font: inherit; padding: 9px 12px; border: 1px solid #8A8886; border-radius: 6px; background: #fff; color: var(--ink); }
  input:focus { outline: 2px solid var(--primary); outline-offset: 1px; border-color: var(--primary); }
  .field { margin-bottom: 16px; }
  .hint { font-size: 13px; color: var(--ink-3); margin-top: 4px; }
  button { font: 600 15px/20px var(--font); border-radius: 6px; cursor: pointer; }
  .primary { width: 100%; padding: 10px 16px; border: 0; color: #fff; background: var(--primary); margin-top: 4px; }
  .primary:hover { background: var(--primary-dark); }
  .primary:disabled { opacity: .6; cursor: default; }
  .link { border: 0; background: none; padding: 0; color: var(--primary-dark); text-decoration: underline; font-weight: 400; font-size: 14px; }
  .error { color: var(--danger); background: #FDE7E9; border-radius: 6px; padding: 8px 12px; margin: 0 0 16px; font-size: 14px; }
  .switch { margin: 20px 0 0; font-size: 14px; color: var(--ink-2); text-align: center; }
  footer { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-3); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.9L19 9.7l-4.9 1.8L12 16.4l-1.8-4.9L5.3 9.7l4.9-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg></div>
  <h1 id="title">Sign in to Sophia</h1>
  <p class="sub" id="sub">The BetterCare assistant</p>

  <form id="form" novalidate>
    <p class="error" id="error" role="alert" hidden></p>
    <div class="field" id="name-field" hidden>
      <label for="name">Your name</label>
      <input id="name" name="name" autocomplete="name" maxlength="80">
    </div>
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="64">
      <div class="hint" id="username-hint" hidden>Lowercase letters, digits, dots, dashes or underscores.</div>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div class="hint" id="password-hint" hidden>At least 8 characters.</div>
    </div>
    <button class="primary" id="submit" type="submit">Sign in</button>
  </form>
  <p class="switch" id="switch" hidden></p>

  <footer>Demo sign-in. Sign-in with your UT Health Microsoft account is on the way.</footer>
</main>
<script type="module">
  const $ = (id) => document.getElementById(id);
  // Only paths on this site, so the page can't be used to send someone elsewhere.
  const raw = new URLSearchParams(location.search).get('next') || '/';
  const next = /^\/(?!\/)[^\\]*$/.test(raw) ? raw : '/';
  let creating = false;

  const cfg = await fetch('/api/auth/config').then((r) => r.json()).catch(() => null);
  if (cfg?.mode === 'header') location.replace(next);   // this server has no sign-in

  function setMode(create) {
    creating = create;
    $('title').textContent = create ? 'Create your account' : 'Sign in to Sophia';
    $('submit').textContent = create ? 'Create account' : 'Sign in';
    $('name-field').hidden = !create;
    $('username-hint').hidden = !create;
    $('password-hint').hidden = !create;
    $('password').autocomplete = create ? 'new-password' : 'current-password';
    $('error').hidden = true;
    const sw = $('switch');
    sw.hidden = !cfg?.signup;
    sw.replaceChildren(create ? 'Have an account? ' : 'New here? ', Object.assign(document.createElement('button'), {
      type: 'button', className: 'link', textContent: create ? 'Sign in' : 'Create an account', onclick: () => setMode(!creating),
    }));
    (create ? $('name') : $('username')).focus();
  }
  setMode(false);

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = { username: $('username').value.trim().toLowerCase(), password: $('password').value };
    if (creating) body.name = $('name').value.trim();
    if (!body.username || !body.password) { showError('Enter your username and password.'); return; }
    $('submit').disabled = true;
    try {
      const res = await fetch(creating ? '/api/auth/signup' : '/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const r = await res.json().catch(() => ({}));
      if (res.ok) { location.replace(next); return; }
      showError(r.message || `Sign-in failed (${res.status}).`);
    } catch {
      showError("Can't reach the Sophia server.");
    }
    $('submit').disabled = false;
  });

  function showError(msg) {
    $('error').textContent = msg;
    $('error').hidden = false;
    $('password').select();
  }
</script>
</body>
</html>
