<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sophia insights</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true">S</span>
      <div>
        <h1>Sophia insights</h1>
        <p class="sub">What people ask BetterCare's assistant, what they find, and where they get stuck</p>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections" hidden>
      <a href="#insights" data-tab="insights">Insights</a>
      <a href="#tests" data-tab="tests">Tests</a>
    </nav>
    <div class="controls" id="controls" hidden>
      <span class="badge badge--demo" id="demoBadge" hidden title="Seeded demo activity is mixed in with real questions. Remove it with: npm run seed:demo -- --clear">Includes demo data</span>
      <label class="ctl" data-insights>Period
        <select id="days">
          <option value="7">Last 7 days</option>
          <option value="30" selected>Last 30 days</option>
          <option value="90">Last 90 days</option>
        </select>
      </label>
      <label class="ctl" data-insights>Role
        <select id="role"><option value="">Everyone</option></select>
      </label>
      <span class="who" id="who"></span>
    </div>
  </header>

  <main id="main">
    <p class="loading">Loading…</p>
  </main>

  <div class="tip" id="tip" role="tooltip" hidden></div>

  <footer class="foot">
    Individual names are hidden by default; questions are grouped by role.
    <span class="ver" id="version"></span>
  </footer>

  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
